spring.application.name=smart-campus-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_campus}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=smartcampussystem@gmail.com
spring.mail.password=${SMTP_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.student.email-domain=${STUDENT_EMAIL_DOMAIN:student.tdtu.edu.vn}
